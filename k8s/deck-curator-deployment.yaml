apiVersion: apps/v1
kind: Deployment
metadata:
  name: deck-curator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deck-curator
  template:
    metadata:
      labels:
        app: deck-curator
    spec:
      containers:
      - name: deck-curator
        image: oci.smeago.com:5000/deck-curator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          # Matches the image's `node` user (uid 1000) — see the Dockerfile.
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5